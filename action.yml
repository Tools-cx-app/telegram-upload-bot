name: Telegram upload bot
description: Send GitHub CI or release details and artifacts to Telegram
inputs:
  bot-token:
    description: Telegram bot token
    required: true
  chat-id:
    description: Telegram chat ID
    required: true
  is-release:
    description: Send a release message instead of a CI message
    required: false
    default: "false"
  files:
    description: Glob of files to upload
    required: false
    default: "./output/*.zip"
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      shell: bash
      run: python -m pip install --disable-pip-version-check "${{ github.action_path }}"
      env:
        PIP_NO_PYTHON_VERSION_WARNING: "1"
    - name: Send Telegram message
      shell: bash
      run: python -m bot
      env:
        BOT_TOKEN: ${{ inputs.bot-token }}
        CHAT_ID: ${{ inputs.chat-id }}
        IS_RELEASE: ${{ inputs.is-release }}
        GH_CI_DIST_PATTERN: ${{ inputs.files }}
        RUN_NO: ${{ github.run_number }}
        RUN_ID: ${{ github.run_id }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_REF: ${{ github.ref }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
